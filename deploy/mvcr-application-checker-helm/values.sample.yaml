# Example values for mvcr-application-checker
# Copy this file to values.yaml and fill in the secrets

bot:
  enabled: true
  image:
    repository: olegeech/mvcr-application-checker
    tag: bot-latest
    pullPolicy: Always
  config:
    ADMIN_CHAT_IDS: "12345, 678910"
    LOG_LEVEL: "INFO"
    REFRESH_PERIOD: "3600"
    SCHEDULER_PERIOD: "300"
    REQUEUE_THRESHOLD_SECONDS: "3600"
    NOT_FOUND_MAX_DAYS: "30"
    NOT_FOUND_REFRESH_PERIOD: "86400"
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 250m
      memory: 512Mi

fetcher:
  enabled: true
  image:
    repository: olegeech/mvcr-application-checker
    tag: fetcher-latest
  replicas: 1
  privileged: true
  config:
    URL: "https://ipc.gov.cz/informace-o-stavu-rizeni/"
    RETRY_INTERVAL: "30"
    PAGE_LOAD_LIMIT_SECONDS: "20"
    CAPTCHA_WAIT_SECONDS: "120"
    JITTER_SECONDS: "600"
    MAX_MESSAGES: "10"
    MAX_RETRIES: "5"

dbDump:
  enabled: true
  schedule: "15 2 * * *"
  timeZone: "Europe/Prague"
  retainCount: 5
  persistence:
    size: 10Gi

# -- Integrated mode (default): PostgreSQL + RabbitMQ deployed in-cluster
postgresql:
  enabled: true
  image:
    repository: postgres
    tag: "16.13"
  database: "AppTrackerDB"
  user: "postgres"
  persistence:
    size: 10Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 500m
      memory: 1Gi

rabbitmq:
  enabled: true
  image:
    repository: rabbitmq
    tag: "4.2-management"
  user: "bunny_admin"
  persistence:
    size: 10Gi
  ssl:
    enabled: true
  service:
    type: LoadBalancer
    annotations:
      external-dns.alpha.kubernetes.io/hostname: mvcr.example.com

# -- Fill these in!
secrets:
  telegramBotToken: "YOUR_TELEGRAM_BOT_TOKEN"
  dbPassword: "YOUR_DB_PASSWORD"
  rabbitPassword: "YOUR_RABBIT_PASSWORD"
  rabbitSSL:
    existingSecret: ""
    caCrt: ""
    serverCrt: ""
    serverKey: ""
    clientCrt: ""
    clientKey: ""

# -- External mode example (uncomment and set postgresql.enabled=false, rabbitmq.enabled=false):
