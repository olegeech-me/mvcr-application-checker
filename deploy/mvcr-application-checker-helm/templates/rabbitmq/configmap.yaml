{{- if and .Values.rabbitmq.enabled .Values.rabbitmq.ssl.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mvcr-application-checker.fullname" . }}-rabbitmq
  labels:
    {{- include "mvcr-application-checker.componentLabels" (dict "context" . "component" "rabbitmq") | nindent 4 }}
data:
  rabbitmq.conf: |
    listeners.ssl.default = 5671
    ssl_options.verify = verify_peer
    ssl_options.fail_if_no_peer_cert = true
    ssl_options.cacertfile = /etc/ssl/ca.crt
    ssl_options.certfile = /etc/ssl/server.crt
    ssl_options.keyfile = /etc/ssl/server.key
{{- end }}
