name: Publish Helm Chart

on:
  push:
    branches:
      - main
    tags:
      - "*"
    paths:
      - "deploy/mvcr-application-checker-helm/**"
  pull_request:
    paths:
      - "deploy/mvcr-application-checker-helm/**"

jobs:
  helm:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Determine chart version
        id: version
        run: |
          CHART_VERSION=$(grep '^version:' deploy/mvcr-application-checker-helm/Chart.yaml | awk '{print $2}')
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            VERSION="${CHART_VERSION}"
          else
            VERSION="${CHART_VERSION}-sha.$(git rev-parse --short ${{ github.sha }})"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "Chart version: $VERSION"

      - name: Set chart version
        run: |
          sed -i "s/^version:.*/version: ${{ env.VERSION }}/" deploy/mvcr-application-checker-helm/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${{ env.VERSION }}\"/" deploy/mvcr-application-checker-helm/Chart.yaml

      - name: Lint chart
        run: helm lint deploy/mvcr-application-checker-helm/

      - name: Package chart
        run: helm package deploy/mvcr-application-checker-helm/ --destination .

      - name: Login to DockerHub OCI
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | helm registry login docker.io -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Push chart to OCI registry
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
        run: helm push mvcr-application-checker-helm-${{ env.VERSION }}.tgz oci://docker.io/olegeech
