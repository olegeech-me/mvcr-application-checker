[build-system]
requires = [
  "python-telegram-bot==20.5",
  "aio-pika==9.2.2",
  "asyncpg==0.28.0",
  "uvloop==0.21.0",
  "pytz",
  "setuptools",
  "pytest"
]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "strict"
filterwarnings = [
    "ignore:coroutine '_broadcast_to_users' was never awaited:RuntimeWarning",
]
