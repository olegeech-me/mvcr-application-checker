[build-system]
requires = [
  "python-telegram-bot==20.5",
  "aio-pika==9.2.2",
  "asyncpg==0.28.0",
  "uvloop==0.21.0",
  "pytz",
  "prometheus-client",
  "setuptools",
  "pytest"
]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py310"
src = ["src"]

[tool.ruff.lint]
# Keep ruff 0.16 defaults; silence noisy rules that do not match project patterns
ignore = [
  "ASYNC230",
  "BLE001",
  "DTZ001",
  "DTZ002",
  "DTZ003",
  "DTZ007",
  "LOG015",
  "PLW1508",
  "RUF059",
  "SIM117",
  "SIM118",
  "TRY002",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
filterwarnings = [
    "ignore:coroutine '_broadcast_to_users' was never awaited:RuntimeWarning",
]
